<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(60% 60% at 50% 40%, #232a33 0%, #14161a 100%);
    color: #e6e6e6; display: flex; align-items: center; justify-content: center;
    font: 14px/1.7 "Microsoft YaHei", system-ui, sans-serif; user-select: none;
  }
  .wrap { text-align: center; }
  /* The mark is the product icon itself (BRAND.md rule 5), not a gold
     pentagon.  No container box: the master has a transparent ground, and
     painting a panel behind it would put a visible square on this dark page.
     `object-fit:contain` keeps the 1:1 art uncropped.  Inlined for the same
     reason the rail mark is: a shipped build serves this page from the exe. */
  .mark {
    display: block; width: 84px; height: 84px; margin: 0 auto 18px;
    object-fit: contain;
  }
  h1 { font-size: 17px; font-weight: 500; margin: 0 0 6px; letter-spacing: .06em; }
  /* The same signature the window title and the rail carry.  This page is
     compiled INTO the exe (tauri-codegen inlines it), so it is the first thing
     a player sees and the last place a copyist would think to look. */
  .by { margin: 0 0 10px; color: #8a949f; font-size: 12px; letter-spacing: .04em; }
  p { margin: 0; color: #8a949f; font-size: 12px; }
  .dots::after {
    content: ""; animation: d 1.4s steps(4, end) infinite;
  }
  @keyframes d {
    0% { content: ""; } 25% { content: "·"; }
    50% { content: "··"; } 75% { content: "···"; }
  }
</style>
