[package]
name = "aoe2mod-serve"
version = "0.1.0"
edition = "2021"
description = "Native workshop engine: library for the shell, binary for development"

[lib]
name = "aoe2mod_serve"
path = "src/lib.rs"

[[bin]]
name = "aoe2mod-serve"
path = "src/main.rs"

[dependencies]
aoe2mod-dat = { path = "../aoe2mod-dat" }
flate2 = "1"
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
