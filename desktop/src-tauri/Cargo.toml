[package]
name = "aoe2-mod-workshop"
version = "0.1.0"
edition = "2021"
description = "AoE2 DE local mod workshop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
